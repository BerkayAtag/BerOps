      tags: [Aksiyonlar]
      summary: Aksiyonlar (yeniden eskiye) ve hedef durum sayaçları
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending_approval, active, completed, cancelled, rejected] } }
        - { name: kind, in: query, schema: { type: string, enum: [deploy_package, run_command] } }
        - { name: machine_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "items, total, page, page_size" }
    post:
      tags: [Aksiyonlar]
      summary: Paket dağıtımı veya komut aksiyonu oluştur
      description: |
        İzin türe göre denetlenir: deploy_package → actions.deploy_package (teknisyen dahil),
        run_command → actions.run_command. Her hedef için iş tanımı sunucunun Ed25519 anahtarıyla imzalanır.
        Denetim kaydı yazılamazsa aksiyon oluşturulmaz (503).
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, machine_ids]
              properties:
                kind: { type: string, enum: [deploy_package, run_command] }
                name: { type: string, maxLength: 200 }
                package_id: { type: string, format: uuid }
                shell: { type: string, enum: [cmd, powershell, sh, zsh] }
                command: { type: string, maxLength: 32768 }
                machine_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 10000 }
                timeout_seconds: { type: integer, minimum: 30, maximum: 86400, default: 3600 }
                bandwidth_kbps: { type: integer, minimum: 64, description: Genel sınırın üstündeyse genel sınır uygulanır }
                expires_hours: { type: integer, minimum: 1, maximum: 720 }
      responses:
        "201": { description: "Oluşturuldu (status: active veya pending_approval)" }
        "400": { description: "Geçersiz istek, aktif olmayan makine veya platform/kabuk uyuşmazlığı" }
