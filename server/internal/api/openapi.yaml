openapi: 3.1.0
info:
  title: Automation BER API
  version: 0.4.0
  description: |
    Automation BER konsol ve ajan API'si.

    **Kimlik doğrulama (konsol):** `POST /api/v1/auth/login` başarılı olduğunda `__Host-ber_session`
    çerezi ayarlanır. Durum değiştiren tüm isteklerde (POST/PUT/PATCH/DELETE) yanıtla dönen
    `csrf_token` değeri `X-CSRF-Token` başlığında gönderilmelidir.

    **Yetkilendirme:** Her uç noktanın gerektirdiği izin `x-ber-permission` alanında belirtilmiştir.
    İzin yoksa `403 auth.forbidden` döner.

    **Ajan API'si** ayrı portta (varsayılan 52311) mTLS ile çalışır.
  license:
    name: Apache-2.0
servers:
  - url: https://localhost:8443
    description: Konsol API
  - url: https://localhost:52311
    description: Ajan API (mTLS)
tags:
  - name: Kimlik
  - name: Sunucu
  - name: Kayıt anahtarları
  - name: Makineler
  - name: Zafiyetler
  - name: Raporlar
  - name: Paketler
  - name: Aksiyonlar
  - name: Ayarlar
  - name: Denetim
  - name: Ajan
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-ber_session
    agentCert:
      type: mutualTLS
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    VulnListItem:
      type: object
      properties:
        cve_id: { type: string, example: CVE-2025-8088 }
        title: { type: string }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW, NONE, ""] }
        cvss_score: { type: [number, "null"] }
        epss: { type: [number, "null"], description: "0-1" }
        epss_percentile: { type: [number, "null"] }
        kev: { type: boolean }
        kev_due: { type: [string, "null"], format: date-time }
        ransomware: { type: boolean }
        exploited: { type: boolean, description: Microsoft "istismar edildi" bildirimi }
        published_at: { type: [string, "null"], format: date-time }
        affected_machines: { type: integer }
        risk_score: { type: number, description: "0-100; ayrıntı docs/cve.md" }
        os: { type: boolean }
        app: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [auth.forbidden] }
        message: { type: string }
    Me:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            display_name: { type: string }
            role: { type: string, enum: [admin, technician, readonly] }
            source: { type: string, enum: [local, ad] }
        permissions:
          type: array
          items: { type: string }
        csrf_token: { type: string }
    RegistrationKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string }
        require_approval: { type: boolean }
        max_uses: { type: [integer, "null"] }
        use_count: { type: integer }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    Machine:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        status: { type: string, enum: [active, pending, rejected, revoked] }
        online: { type: boolean }
        os_platform: { type: string, enum: [windows, darwin] }
        os_name: { type: string }
        os_version: { type: string }
        os_build: { type: string, description: "Yama seviyesi, ör. 10.0.22631.4460" }
        arch: { type: string }
        ip_addresses: { type: array, items: { type: string } }
        agent_version: { type: string }
        ad_ou: { type: string }
        cert_fingerprint: { type: string }
        cert_expires_at: { type: string, format: date-time }
        enrolled_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        agent_started_at: { type: [string, "null"], format: date-time }
        last_errors: { type: array, items: { type: string } }
    HostInfo:
      type: object
      required: [hostname, os_platform]
      properties:
        hostname: { type: string }
        os_platform: { type: string, enum: [windows, darwin] }
        os_name: { type: string }
        os_version: { type: string }
        os_build: { type: string }
        arch: { type: string }
        ip_addresses: { type: array, items: { type: string } }
        agent_version: { type: string }
    MissingPatch:
      type: object
      properties:
        id: { type: string }
        kb: { type: string }
        title: { type: string }
        classification: { type: string }
        severity: { type: string, enum: [Critical, Important, Moderate, Low, ""] }
        released_at: { type: string, format: date-time }
        reboot_required: { type: boolean }
        size_bytes: { type: integer }
        cves: { type: array, items: { type: string } }
        version: { type: string }
        recommended: { type: boolean }
        support_url: { type: string }
    AgentSettings:
      type: object
      required: [full_scan_interval_hours, delta_scan_interval_hours, scan_cpu_limit_percent, defer_on_battery,
        defer_when_user_active, windows_update_source]
      properties:
        full_scan_interval_hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
        delta_scan_interval_hours: { type: integer, minimum: 1, default: 4 }
        scan_cpu_limit_percent: { type: integer, minimum: 1, maximum: 100, default: 10 }
        defer_on_battery: { type: boolean, default: true }
        defer_when_user_active: { type: boolean, default: false }
        windows_update_source: { type: string, enum: [online, offline], default: online }
  responses:
    Unauthorized:
      description: Oturum yok veya geçersiz
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Yetki yok veya CSRF doğrulaması başarısız
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /api/v1/health:
    get:
      tags: [Sunucu]
      summary: Sağlık durumu
      security: []
      responses:
        "200": { description: Sunucu ve veritabanı çalışıyor }
        "503": { description: Veritabanına erişilemiyor }
  /api/v1/auth/login:
    post:
      tags: [Kimlik]
      summary: Kullanıcı adı ve parola ile giriş
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Giriş başarılı; oturum çerezi ayarlanır
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Çok fazla başarısız deneme (Retry-After başlığı)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/v1/auth/logout:
    post:
      tags: [Kimlik]
      summary: Oturumu kapat
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Oturum kapatıldı }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      tags: [Kimlik]
      summary: Oturumdaki kullanıcı, izinleri ve CSRF token'ı
      security: [{ session: [] }]
      responses:
        "200":
          description: Kullanıcı bilgisi
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/server-info:
    get:
      tags: [Sunucu]
      summary: Sunucu sürümü, ajan adresi ve CA parmak izi
      security: [{ session: [] }]
      x-ber-permission: machines.read
      responses:
        "200":
          description: Sunucu bilgisi
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  agent_url: { type: string }
                  ca_fingerprint: { type: string, examples: ["sha256:3f2a…"] }
  /api/v1/registration-keys:
    get:
      tags: [Kayıt anahtarları]
      summary: Kayıt anahtarlarını listele
      security: [{ session: [] }]
      x-ber-permission: regkeys.manage
      responses:
        "200":
          description: Anahtar listesi (anahtarların kendisi dönmez)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/RegistrationKey" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Kayıt anahtarları]
      summary: Yeni kayıt anahtarı oluştur
      description: Anahtarın düz metni yalnızca bu yanıtta bir kez döner.
      security: [{ session: [] }]
      x-ber-permission: regkeys.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                require_approval: { type: boolean, default: false }
                max_uses: { type: [integer, "null"], minimum: 1 }
                expires_in_hours: { type: [integer, "null"], minimum: 1, maximum: 8760 }
      responses:
        "201":
          description: Anahtar oluşturuldu
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: "#/components/schemas/RegistrationKey" }
                  secret: { type: string, examples: ["berreg_…"] }
                  install:
                    type: object
                    properties:
                      windows: { type: string }
                      macos: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/registration-keys/{id}:
    delete:
      tags: [Kayıt anahtarları]
      summary: Kayıt anahtarını iptal et
      security: [{ session: [] }]
      x-ber-permission: regkeys.manage
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: İptal edildi }
        "404": { description: Bulunamadı veya zaten iptal edilmiş }
  /api/v1/machines:
    get:
      tags: [Makineler]
      summary: Makineleri ara, filtrele, sırala ve sayfala
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Hostname, IP, işletim sistemi, yama seviyesi veya OU içinde arar" }
        - { name: platform, in: query, schema: { type: string, enum: [windows, darwin] } }
        - { name: status, in: query, schema: { type: string, enum: [active, pending, rejected, revoked] } }
        - { name: online, in: query, schema: { type: boolean } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [hostname, os, os_build, agent_version, last_seen_at, enrolled_at, missing_count, missing_critical, app_count, risk, vulns, status]
            default: hostname
        - { name: desc, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Makine sayfası
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Machine"
                        - type: object
                          properties:
                            inventory_at: { type: [string, "null"], format: date-time }
                            missing_count: { type: integer }
                            missing_critical_count: { type: integer }
                            missing_security_count: { type: integer }
                            app_count: { type: integer }
                            reboot_pending: { type: boolean }
                            vuln_count: { type: integer }
                            kev_count: { type: integer }
                            max_risk: { type: number }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
  /api/v1/machines/summary:
    get:
      tags: [Makineler]
      summary: Filo özeti (gösterge paneli sayaçları)
      security: [{ session: [] }]
      x-ber-permission: machines.read
      responses:
        "200": { description: "Toplam/çevrimiçi/onay bekleyen makine, eksik yama ve uyumluluk sayaçları" }
  /api/v1/machines/scan:
    post:
      tags: [Makineler]
      summary: Seçilen makineler için yeniden tarama iste
      description: İstek sonraki heartbeat'te ajana iletilir ve tam envanter gelene kadar bekletilir.
      security: [{ session: [] }]
      x-ber-permission: machines.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machine_ids]
              properties:
                machine_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 5000 }
      responses:
        "200": { description: "Kabul edilen makine sayısı (accepted)" }
  /api/v1/machines/{id}:
    get:
      tags: [Makineler]
      summary: Makine ayrıntısı ve envanter özeti
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: "machine, online, scan_requested_at, inventory ve risk (yoksa null)" }
        "404": { description: Bulunamadı }
  /api/v1/machines/{id}/missing-patches:
    get:
      tags: [Makineler]
      summary: Eksik yamalar (önem sırasına göre)
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Eksik yamalar
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MissingPatch" } }
  /api/v1/machines/{id}/installed-patches:
    get:
      tags: [Makineler]
      summary: Kurulu yamalar
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Kurulu yamalar }
  /api/v1/machines/{id}/apps:
    get:
      tags: [Makineler]
      summary: Kurulu üçüncü parti uygulamalar
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Uygulamalar }
  /api/v1/machines/{id}/vulnerabilities:
    get:
      tags: [Zafiyetler]
      summary: Makinedeki CVE bulguları (risk sırasıyla)
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: "items: cve_id, title, severity, cvss_score, epss, kev, sources, refs, fixed_by, risk_score, first_seen_at" }
  /api/v1/dashboard/risk:
    get:
      tags: [Zafiyetler]
      summary: Gösterge paneli risk özeti
      security: [{ session: [] }]
      x-ber-permission: reports.read
      responses:
        "200": { description: "distinct_cves, kev_machines, urgent_cves, avg_machine_risk, by_severity, top_cves, top_machines, trend (30 gün)" }
  /api/v1/vulnerabilities:
    get:
      tags: [Zafiyetler]
      summary: Filo genelindeki CVE'ler (etkilenen makine sayısı ve risk)
      security: [{ session: [] }]
      x-ber-permission: reports.read
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "CVE kimliği, başlık veya açıklamada arar" }
        - { name: severity, in: query, schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] } }
        - { name: kev, in: query, schema: { type: boolean }, description: Yalnızca CISA KEV'dekiler }
        - { name: kind, in: query, schema: { type: string, enum: [os, app] } }
        - { name: sort, in: query, schema: { type: string, enum: [risk, cvss, epss, affected, published, cve], default: risk } }
        - { name: desc, in: query, schema: { type: boolean, default: true } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Zafiyet sayfası
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/VulnListItem" } }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
        "400": { description: Geçersiz filtre }
  /api/v1/vulnerabilities/{id}:
    get:
      tags: [Zafiyetler]
      summary: CVE ayrıntısı, KEV/EPSS bilgisi, düzelten KB'ler ve etkilenen makineler
      security: [{ session: [] }]
      x-ber-permission: reports.read
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^CVE-\\d{4}-\\d{4,}$" } }]
      responses:
        "200": { description: CVE ayrıntısı }
        "404": { description: CVE ne kaynaklarda ne makinelerde var }
  /api/v1/reports/{type}:
    get:
      tags: [Raporlar]
      summary: Raporu PDF, Excel veya CSV olarak indir
      description: Her dışa aktarma denetim kaydına yazılır. PDF en fazla 5000 satır içerir.
      security: [{ session: [] }]
      x-ber-permission: reports.export
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [compliance, vulnerabilities, missing-patches, apps] } }
        - { name: format, in: query, schema: { type: string, enum: [pdf, xlsx, csv], default: xlsx } }
        - { name: lang, in: query, schema: { type: string, enum: [tr, en], default: tr } }
        - { name: tz, in: query, schema: { type: string, example: Europe/Istanbul }, description: Tarihlerin yazılacağı IANA saat dilimi }
        - { name: platform, in: query, schema: { type: string, enum: [windows, darwin] }, description: "compliance, missing-patches, apps" }
        - { name: severity, in: query, schema: { type: string }, description: "vulnerabilities: CRITICAL…LOW; missing-patches: Critical, Important, Moderate, Low" }
        - { name: kev, in: query, schema: { type: boolean }, description: vulnerabilities }
        - { name: q, in: query, schema: { type: string }, description: "vulnerabilities, apps" }
      responses:
        "200":
          description: Rapor dosyası (Content-Disposition attachment)
          content:
            application/pdf: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            text/csv: {}
        "400": { description: Geçersiz biçim veya filtre }
        "404": { description: Bilinmeyen rapor türü }
  /api/v1/cve/status:
    get:
      tags: [Ayarlar]
      summary: CVE kaynaklarının eşitleme durumu
      security: [{ session: [] }]
      x-ber-permission: settings.read
      responses:
        "200": { description: "enabled, offline, running, sync_interval_hours, nvd_api_key (var/yok), msrc_months, feeds, tracked_products" }
  /api/v1/cve/sync:
    post:
      tags: [Ayarlar]
      summary: CVE kaynaklarını hemen eşitle (arka planda)
      security: [{ session: [] }]
      x-ber-permission: settings.write
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "202": { description: Eşitleme başlatıldı }
        "409": { description: Eşitleme zaten çalışıyor veya yapılandırmada kapalı }
  /api/v1/cve/rules:
    get:
      tags: [Ayarlar]
      summary: Uygulama → CPE kuralları (özel kurallar önce, sonra yerleşik sözlük)
      security: [{ session: [] }]
      x-ber-permission: settings.read
      responses:
        "200": { description: "items: id, name, publisher, identifier, os, part, vendor, product, builtin" }
    post:
      tags: [Ayarlar]
      summary: Özel kural ekle
      security: [{ session: [] }]
      x-ber-permission: settings.write
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vendor, product]
              properties:
                name: { type: string, description: Uygulama adı düzenli ifadesi (büyük/küçük harf duyarsız) }
                publisher: { type: string }
                identifier: { type: string, description: "MSI ürün kodu, bundle kimliği veya Homebrew formülü kalıbı" }
                vendor: { type: string, example: google }
                product: { type: string, example: chrome }
      responses:
        "201": { description: Eklendi }
        "400": { description: Geçersiz düzenli ifade veya CPE adı }
  /api/v1/cve/rules/{id}:
    delete:
      tags: [Ayarlar]
      summary: Özel kuralı sil
      security: [{ session: [] }]
      x-ber-permission: settings.write
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Silindi }
        "404": { description: Bulunamadı }
  /api/v1/packages:
    get:
      tags: [Paketler]
      summary: Paket kütüphanesi
      security: [{ session: [] }]
      x-ber-permission: packages.read
      parameters:
        - { name: platform, in: query, schema: { type: string, enum: [windows, darwin] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: "items: paketler" }
    post:
      tags: [Paketler]
      summary: Paket yükle (multipart; önce metadata, sonra file)
      security: [{ session: [] }]
      x-ber-permission: packages.upload
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata:
                  type: string
                  description: |
                    JSON: name, version, publisher, platform (windows|darwin), installer (msi|exe|pkg|dmg|file),
                    install_command ({file} yer tutucusu), shell, success_codes, detect_name, description
                file: { type: string, format: binary }
      responses:
        "201": { description: Yüklendi (SHA-256 sunucuda hesaplanır) }
        "400": { description: Geçersiz bilgi veya uzantı }
        "409": { description: Aynı platformda aynı ad ve sürüm var }
        "413": { description: Dosya sınırı aşıldı }
  /api/v1/packages/{id}:
    get:
      tags: [Paketler]
      summary: Paket ayrıntısı ve güncelleme gereken makineler
      security: [{ session: [] }]
      x-ber-permission: packages.read
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: "Paket + outdated (machine_id, hostname, name, version) + up_to_date" }
        "404": { description: Bulunamadı }
    delete:
      tags: [Paketler]
      summary: Paketi kütüphaneden kaldır
      security: [{ session: [] }]
      x-ber-permission: packages.delete
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "204": { description: Silindi }
  /api/v1/actions:
    get:
      tags: [Aksiyonlar]
      summary: Aksiyonlar (yeniden eskiye) ve hedef durum sayaçları
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending_approval, active, completed, cancelled, rejected] } }
        - { name: kind, in: query, schema: { type: string, enum: [deploy_package, run_command] } }
        - { name: machine_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: "items, total, page, page_size" }
    post:
      tags: [Aksiyonlar]
      summary: Paket dağıtımı veya komut aksiyonu oluştur
      description: |
        İzin türe göre denetlenir: deploy_package → actions.deploy_package (teknisyen dahil),
        run_command → actions.run_command. Her hedef için iş tanımı sunucunun Ed25519 anahtarıyla imzalanır.
        Denetim kaydı yazılamazsa aksiyon oluşturulmaz (503).
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, machine_ids]
              properties:
                kind: { type: string, enum: [deploy_package, run_command] }
                name: { type: string, maxLength: 200 }
                package_id: { type: string, format: uuid }
                shell: { type: string, enum: [cmd, powershell, sh, zsh] }
                command: { type: string, maxLength: 32768 }
                machine_ids: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 10000 }
                timeout_seconds: { type: integer, minimum: 30, maximum: 86400, default: 3600 }
                bandwidth_kbps: { type: integer, minimum: 64, description: Genel sınırın üstündeyse genel sınır uygulanır }
                expires_hours: { type: integer, minimum: 1, maximum: 720 }
      responses:
        "201": { description: "Oluşturuldu (status: active veya pending_approval)" }
        "400": { description: "Geçersiz istek, aktif olmayan makine veya platform/kabuk uyuşmazlığı" }
        "403": { description: Yetki yok }
  /api/v1/actions/{id}:
    get:
      tags: [Aksiyonlar]
      summary: Aksiyon ve hedef başına sonuçlar (çıkış kodu, stdout, stderr)
      security: [{ session: [] }]
      x-ber-permission: machines.read
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: "action, targets" }
  /api/v1/actions/{id}/approve:
    post:
      tags: [Aksiyonlar]
      summary: Onay bekleyen aksiyonu onayla (oluşturan kişi onaylayamaz)
      security: [{ session: [] }]
      x-ber-permission: actions.approve
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Onaylandı }
        "409": { description: Onay beklemiyor }
  /api/v1/actions/{id}/reject:
    post:
      tags: [Aksiyonlar]
      summary: Onay bekleyen aksiyonu reddet
      security: [{ session: [] }]
      x-ber-permission: actions.approve
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Reddedildi }
  /api/v1/actions/{id}/cancel:
    post:
      tags: [Aksiyonlar]
      summary: Aksiyonu iptal et (başlamamış hedefler çalıştırılmaz)
      security: [{ session: [] }]
      x-ber-permission: "actions.deploy_package veya actions.run_command (türe göre)"
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: İptal edildi }
        "409": { description: Aksiyon zaten bitmiş }
  /api/v1/settings/transfer:
    get:
      tags: [Ayarlar]
      summary: Aktarım ayarları
      security: [{ session: [] }]
      x-ber-permission: settings.read
      responses:
        "200": { description: "per_client_kbps, max_upload_mb, command_approval, default_expiry_hours" }
    put:
      tags: [Ayarlar]
      summary: Aktarım ayarlarını değiştir
      security: [{ session: [] }]
      x-ber-permission: transfer.limits.manage
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Kaydedildi }
        "400": { description: Geçersiz değer }
  /api/v1/settings/agent:
    get:
      tags: [Ayarlar]
      summary: Ajan ve tarama ayarları
      security: [{ session: [] }]
      x-ber-permission: settings.read
      responses:
        "200": { description: "settings ve sunucudaki wsusscn2.cab bilgisi (wsus_cab, yoksa null)" }
    put:
      tags: [Ayarlar]
      summary: Ajan ve tarama ayarlarını değiştir
      security: [{ session: [] }]
      x-ber-permission: settings.write
      parameters: [{ $ref: "#/components/parameters/CSRF" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSettings" }
      responses:
        "200": { description: Kaydedildi }
        "400": { description: Geçersiz değerler }
  /api/v1/machines/{id}/approve:
    post:
      tags: [Makineler]
      summary: Onay bekleyen makineyi onayla
      security: [{ session: [] }]
      x-ber-permission: machines.manage
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Onaylandı }
        "409": { description: Makine onay bekleyen durumda değil }
  /api/v1/machines/{id}/reject:
    post:
      tags: [Makineler]
      summary: Makineyi reddet (sertifikası geçersiz sayılır)
      security: [{ session: [] }]
      x-ber-permission: machines.manage
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRF" }]
      responses:
        "200": { description: Reddedildi }
        "409": { description: Makine bu işleme uygun durumda değil }
  /api/v1/audit:
    get:
      tags: [Denetim]
      summary: Son 200 denetim kaydı
      security: [{ session: [] }]
      x-ber-permission: audit.read
      responses:
        "200": { description: Denetim kayıtları }
  /agent/v1/enroll:
    post:
      tags: [Ajan]
      summary: Ajan kaydı (istemci sertifikası olmadan)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_key, csr_pem, host]
              properties:
                registration_key: { type: string }
                csr_pem: { type: string, description: "ECDSA P-256 CSR (PEM)" }
                host: { $ref: "#/components/schemas/HostInfo" }
      responses:
        "201":
          description: Kayıt başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: { type: string, format: uuid }
                  status: { type: string, enum: [active, pending] }
                  certificate_pem: { type: string }
                  ca_certificate_pem: { type: string }
                  heartbeat_seconds: { type: integer }
        "400": { description: Geçersiz CSR veya host bilgisi }
        "401": { description: Geçersiz kayıt anahtarı }
        "429": { description: Çok fazla başarısız deneme }
  /agent/v1/heartbeat:
    post:
      tags: [Ajan]
      summary: Ajan heartbeat
      security: [{ agentCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { $ref: "#/components/schemas/HostInfo" }
                agent_started_at: { type: string, format: date-time }
                errors: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        "200":
          description: Heartbeat kaydedildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  heartbeat_seconds: { type: integer }
                  server_time: { type: string, format: date-time }
        "401": { description: Sertifika yok, tanınmıyor veya yenilenmiş }
        "403": { description: Makine reddedilmiş veya iptal edilmiş }
  /agent/v1/inventory:
    post:
      tags: [Ajan]
      summary: Envanter yükleme (tam veya yalnızca değişen bölümler)
      description: |
        Gövde gzip ile sıkıştırılabilir (`Content-Encoding: gzip`, açılmış boyut en fazla 32 MiB).
        `included` listesinde olmayan bölümler sunucuda değiştirilmez. `full: true` ise sunucu bölüm
        özetlerini gönderilenlerle değiştirir.
      security: [{ agentCert: [] }]
      responses:
        "204": { description: Kaydedildi }
        "400": { description: Geçersiz rapor }
  /agent/v1/files/wsusscn2.cab:
    get:
      tags: [Ajan]
      summary: Çevrimdışı Windows Update kataloğu
      description: Range (kaldığı yerden devam) ve If-Modified-Since desteklenir.
      security: [{ agentCert: [] }]
      responses:
        "200": { description: Dosya }
        "206": { description: Kısmi içerik }
        "304": { description: Değişmedi }
        "404": { description: Sunucuda katalog yok }
  /agent/v1/jobs:
    get:
      tags: [Ajan]
      summary: Bekleyen imzalı işler (heartbeat pending_jobs > 0 olduğunda çağrılır)
      security: [{ agentCert: [] }]
      responses:
        "200": { description: "jobs: [{payload (base64 JSON), signature (base64 Ed25519)}]" }
  /agent/v1/jobs/{id}/status:
    post:
      tags: [Ajan]
      summary: İş durumunu bildir (downloading, running, succeeded, failed)
      security: [{ agentCert: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Kaydedildi }
        "409": { description: İş zaten sonuçlanmış veya iptal edilmiş }
  /agent/v1/packages/{id}/file:
    get:
      tags: [Ajan]
      summary: Paket dosyası (istemci başına hız sınırlı, Range destekli)
      security: [{ agentCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Dosya }
        "206": { description: Kısmi içerik }
        "404": { description: Bu makine için açık dağıtım yok }
