                type: object
                properties:
                  agent_id: { type: string, format: uuid }
                  status: { type: string, enum: [active, pending] }
                  certificate_pem: { type: string }
                  ca_certificate_pem: { type: string }
                  heartbeat_seconds: { type: integer }
        "400": { description: Geçersiz CSR veya host bilgisi }
        "401": { description: Geçersiz kayıt anahtarı }
        "429": { description: Çok fazla başarısız deneme }
  /agent/v1/heartbeat:
    post:
      tags: [Ajan]
      summary: Ajan heartbeat
      security: [{ agentCert: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { $ref: "#/components/schemas/HostInfo" }
                agent_started_at: { type: string, format: date-time }
                errors: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        "200":
          description: Heartbeat kaydedildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  heartbeat_seconds: { type: integer }
                  server_time: { type: string, format: date-time }
        "401": { description: Sertifika yok, tanınmıyor veya yenilenmiş }
        "403": { description: Makine reddedilmiş veya iptal edilmiş }
  /agent/v1/inventory:
    post:
      tags: [Ajan]
      summary: Envanter yükleme (tam veya yalnızca değişen bölümler)
      description: |
        Gövde gzip ile sıkıştırılabilir (`Content-Encoding: gzip`, açılmış boyut en fazla 32 MiB).
        `included` listesinde olmayan bölümler sunucuda değiştirilmez. `full: true` ise sunucu bölüm
        özetlerini gönderilenlerle değiştirir.
      security: [{ agentCert: [] }]
      responses:
        "204": { description: Kaydedildi }
        "400": { description: Geçersiz rapor }
  /agent/v1/files/wsusscn2.cab:
    get:
      tags: [Ajan]
      summary: Çevrimdışı Windows Update kataloğu
      description: Range (kaldığı yerden devam) ve If-Modified-Since desteklenir.
      security: [{ agentCert: [] }]
      responses:
        "200": { description: Dosya }
        "206": { description: Kısmi içerik }
        "304": { description: Değişmedi }
        "404": { description: Sunucuda katalog yok }
  /agent/v1/jobs:
    get:
      tags: [Ajan]
      summary: Bekleyen imzalı işler (heartbeat pending_jobs > 0 olduğunda çağrılır)
      security: [{ agentCert: [] }]
      responses:
        "200": { description: "jobs: [{payload (base64 JSON), signature (base64 Ed25519)}]" }
  /agent/v1/jobs/{id}/status:
    post:
      tags: [Ajan]
      summary: İş durumunu bildir (downloading, running, succeeded, failed)
      security: [{ agentCert: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Kaydedildi }
        "409": { description: İş zaten sonuçlanmış veya iptal edilmiş }
  /agent/v1/packages/{id}/file:
    get:
      tags: [Ajan]
      summary: Paket dosyası (istemci başına hız sınırlı, Range destekli)
      security: [{ agentCert: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Dosya }
        "206": { description: Kısmi içerik }
        "404": { description: Bu makine için açık dağıtım yok }
  /agent/v1/remote/poll:
    get:
      tags: [Ajan]
      summary: Uzaktan oturumdaki sıradaki imzalı isteği uzun yoklamayla bekle (≤25 sn)
      security: [{ agentCert: [] }]
      responses:
        "200": { description: İmzalı istek (payload, signature) }
        "204": { description: İstek yok veya oturum bitti }
  /agent/v1/remote/{id}/result:
    post:
      tags: [Ajan]
      summary: Uzaktan isteğin sonucu
      security: [{ agentCert: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Teslim edildi }
        "404": { description: İstek bulunamadı veya zaman aşımına uğradı }
  /agent/v1/relay/files/{sha256}:
    get:
      tags: [Ajan]
      summary: "Relay önbelleği için paket dosyası (yalnızca relay sertifikası, hız sınırsız)"
      security: [{ relayCert: [] }]
      parameters: [{ name: sha256, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Dosya }
        "403": { description: Relay sertifikası değil }
        "404": { description: Dosya yok }
