# Geliştirme ortamı: yalnızca PostgreSQL. Sunucu yerelde `go run` ile çalıştırılır.
#   docker compose -f deploy/docker-compose.dev.yml up -d
# Buradaki kimlik bilgileri yalnızca yerel geliştirme içindir.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ber
      POSTGRES_PASSWORD: ber
      POSTGRES_DB: ber_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ber-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ber -d ber_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ber-pgdata:
