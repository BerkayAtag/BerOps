# Automation BER — Linux için Docker Compose kurulumu (sunucu + PostgreSQL).
#
#   cp deploy/.env.example deploy/.env   # parolaları ve sunucu adını düzenleyin
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   docker compose -f deploy/docker-compose.yml exec server ber-server admin create -username admin
#
# Ayrıntılar: docs/kurulum-sunucu.md
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ber
      POSTGRES_PASSWORD: ${BER_DB_PASSWORD:?BER_DB_PASSWORD gerekli}
      POSTGRES_DB: ber
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ber -d ber"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: ${BER_IMAGE:-ghcr.io/berkayatag/automation-ber-server:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BER_DATABASE_URL: postgres://ber:${BER_DB_PASSWORD}@postgres:5432/ber?sslmode=disable
      BER_HOSTNAMES: ${BER_HOSTNAMES:?BER_HOSTNAMES gerekli (ör. ber.ornek.local)}
      BER_NVD_API_KEY: ${BER_NVD_API_KEY:-}
    ports:
      - "${BER_CONSOLE_PORT:-8443}:8443"
      - "${BER_AGENT_PORT:-52311}:52311"
    volumes:
      - berdata:/var/lib/ber

volumes:
  pgdata:
  berdata:
