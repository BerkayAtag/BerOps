name: Release

# v* etiketiyle tetiklenir: sunucu ve ajan MSI'ları, macOS .pkg, relay ve sunucu arşivleri,
# Docker imajı ve SHA-256 özet dosyası üretilip GitHub Releases'a yüklenir.
#
# İsteğe bağlı imzalama sırları (yoksa imzasız derlenir ve sürüm notunda belirtilir):
#   WINDOWS_CERT_PFX (base64), WINDOWS_CERT_PASSWORD
#   MACOS_CERT_P12 (base64, Developer ID Application + Installer), MACOS_CERT_PASSWORD,
#   MACOS_APP_IDENTITY, MACOS_INSTALLER_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  LDPKG: github.com/BerkayAtag/BerOps/shared/version

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - working-directory: console
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: console/dist

  archives:
    needs: [meta, console]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console/dist
      - name: Sunucu ve relay arşivleri
        env:
          CGO_ENABLED: "0"
        run: |
          LD="-s -w -X $LDPKG.Version=$VERSION -X $LDPKG.Commit=$GITHUB_SHA"
          mkdir -p out
          for target in linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            d=work/berops-server-$VERSION-$os-$arch
            mkdir -p "$d"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LD" -o "$d/berops-server" ./server/cmd/berops-server
            cp -r console/dist "$d/console"
            cp LICENSE NOTICE "$d/"
            cp docs/kurulum-sunucu.md "$d/KURULUM.md"
            tar -C work -czf "out/$(basename "$d").tar.gz" "$(basename "$d")"
          done
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            d=work/berops-relay-$VERSION-$os-$arch
            mkdir -p "$d"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LD" -o "$d/berops-relay$ext" ./relay/cmd/berops-relay
            cp LICENSE relay/README.md "$d/"
            if [ "$os" = windows ]; then (cd work && zip -qr "../out/$(basename "$d").zip" "$(basename "$d")")
            else tar -C work -czf "out/$(basename "$d").tar.gz" "$(basename "$d")"; fi
          done
          ls -lh out
      - uses: actions/upload-artifact@v7
        with:
          name: archives
          path: out/*

  windows:
    needs: [meta, console]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console/dist
      - name: İkili dosyalar
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ld = "-s -w -X $env:LDPKG.Version=$env:VERSION -X $env:LDPKG.Commit=$env:GITHUB_SHA"
          go build -trimpath -ldflags $ld -o dist/berops-agent.exe ./agent/cmd/berops-agent
          go build -trimpath -ldflags $ld -o dist/berops-server.exe ./server/cmd/berops-server
      - name: İmzalama aracı
        id: sign
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) { "signed=false" >> $env:GITHUB_OUTPUT; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "PFX=$pfx" >> $env:GITHUB_ENV
          & $signtool sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/berops-agent.exe dist/berops-server.exe
          if ($LASTEXITCODE -ne 0) { throw 'imzalama başarısız' }
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: MSI paketleri
        shell: pwsh
        run: ./installers/windows/build.ps1 -Version $env:VERSION -AgentExe dist/berops-agent.exe -ServerExe dist/berops-server.exe -ConsoleDir console/dist -OutDir out
      - name: MSI imzalama
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem out/*.msi).FullName
          if ($LASTEXITCODE -ne 0) { throw 'MSI imzalama başarısız' }
      - name: Ajan ikili dosyası (MSI dışı kullanım için)
        shell: pwsh
        run: Compress-Archive -Path dist/berops-agent.exe, LICENSE -DestinationPath "out/berops-agent-$env:VERSION-windows-amd64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*

  macos:
    needs: meta
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    outputs:
      signed: ${{ steps.keychain.outputs.signed }}
      notarized: ${{ steps.keychain.outputs.notarized }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Universal ikili dosya
        env:
          CGO_ENABLED: "0"
        run: |
          LD="-s -w -X $LDPKG.Version=$VERSION -X $LDPKG.Commit=$GITHUB_SHA"
          GOARCH=arm64 go build -trimpath -ldflags "$LD" -o dist/berops-agent-arm64 ./agent/cmd/berops-agent
          GOARCH=amd64 go build -trimpath -ldflags "$LD" -o dist/berops-agent-amd64 ./agent/cmd/berops-agent
          lipo -create -output dist/berops-agent dist/berops-agent-arm64 dist/berops-agent-amd64
      - name: İmza anahtar zinciri
        id: keychain
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; echo "notarized=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"; KCPASS=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "signed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials ber-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
            echo "NOTARY_PROFILE=ber-notary" >> "$GITHUB_ENV"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Paket
        env:
          MACOS_APP_IDENTITY: ${{ steps.keychain.outputs.signed == 'true' && secrets.MACOS_APP_IDENTITY || '' }}
          MACOS_INSTALLER_IDENTITY: ${{ steps.keychain.outputs.signed == 'true' && secrets.MACOS_INSTALLER_IDENTITY || '' }}
        run: |
          mkdir -p out
          installers/macos/build-pkg.sh "$VERSION" dist/berops-agent "out/BerOps-Agent.pkg"
          cp installers/macos/pppc-berops-agent.mobileconfig out/
          (cd dist && zip -q "../out/berops-agent-$VERSION-darwin-universal.zip" berops-agent)
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*

  docker:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/berkayatag/berops-server:${{ needs.meta.outputs.version }}
            ${{ !contains(needs.meta.outputs.version, '-') && 'ghcr.io/berkayatag/berops-server:latest' || '' }}
          labels: |
            org.opencontainers.image.title=BerOps Server
            org.opencontainers.image.vendor=Berkay Atağ
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

  release:
    needs: [meta, archives, windows, macos, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "{archives,windows,macos}"
          merge-multiple: true
      - name: Özetler ve sürüm notu
        env:
          WIN_SIGNED: ${{ needs.windows.outputs.signed }}
          MAC_SIGNED: ${{ needs.macos.outputs.signed }}
          MAC_NOTARIZED: ${{ needs.macos.outputs.notarized }}
        run: |
          cd artifacts && sha256sum * > SHA256SUMS.txt && cd ..
          {
            echo "## BerOps $VERSION"
            echo
            echo "| Dosya | Açıklama |"
            echo "|---|---|"
            echo "| \`BerOps-Server-x64.msi\` | **Sunucu kurulumu** (Windows Server, sihirbazlı) |"
            echo "| \`berops-server-$VERSION-linux-*.tar.gz\` | Sunucu (Linux) + konsol |"
            echo "| \`ghcr.io/berkayatag/berops-server:$VERSION\` | Sunucu Docker imajı (\`deploy/docker-compose.yml\`) |"
            echo "| \`BerOps-Agent-x64.msi\` | Windows ajanı (sessiz kurulum: \`SERVER\`, \`REGKEY\`, \`CAHASH\`) |"
            echo "| \`BerOps-Agent.pkg\` | macOS ajanı (Intel + Apple Silicon) |"
            echo "| \`pppc-berops-agent.mobileconfig\` | macOS Tam Disk Erişimi örnek MDM profili |"
            echo "| \`berops-relay-$VERSION-*\` | Şube relay'i |"
            echo "| \`SHA256SUMS.txt\` | SHA-256 özetleri |"
            echo
            echo "### Kod imzalama"
            [ "$WIN_SIGNED" = true ] && echo "- Windows: Authenticode ile imzalı." || echo "- Windows: **imzasız** (imza sertifikası tanımlı değil). SmartScreen uyarısı görülebilir; dosyayı SHA256SUMS.txt ile doğrulayın."
            if [ "$MAC_SIGNED" = true ]; then
              [ "$MAC_NOTARIZED" = true ] && echo "- macOS: Developer ID ile imzalı ve notarize edilmiş." || echo "- macOS: Developer ID ile imzalı, notarize edilmemiş."
            else
              echo "- macOS: **imzasız** (Developer ID tanımlı değil). Gatekeeper uyarısı görülebilir; MDM ile dağıtım veya \`sudo installer -pkg ... -target /\` önerilir."
            fi
            echo
            echo "Kurulum: [sunucu](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/kurulum-sunucu.md) · [Windows ajanı](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/kurulum-ajan-windows.md) · [macOS ajanı](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/kurulum-ajan-macos.md)"
            echo
            echo "Değişiklikler: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)"
          } > notes.md
          cat notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* --title "BerOps $VERSION" --notes-file notes.md $flags
