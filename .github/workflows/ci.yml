name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test, güvenlik)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ber
          POSTGRES_PASSWORD: ber
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BER_TEST_DATABASE_URL: postgres://ber:ber@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Biçim kontrolü (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt uygulanmamış dosyalar:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Birim ve entegrasyon testleri
        run: go test -race -coverprofile=coverage.out ./...
      - name: Bağımlılık güvenlik taraması (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  go-cross:
    name: Çapraz derleme (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Derle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /dev/null ./agent/cmd/ber-agent
          go build -trimpath -o /dev/null ./server/cmd/ber-server
          go build -trimpath -o /dev/null ./relay/cmd/ber-relay

  agent-native:
    name: Ajan testleri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ajan ve ortak paket testleri (gerçek envanter toplama dahil)
        env:
          BER_LIVE_INVENTORY: "1"
        run: go test -v -run 'TestLiveCollect' ./agent/internal/inventory/ && go test ./agent/... ./shared/...
      - name: Envanter tanılama komutu
        run: go run ./agent/cmd/ber-agent inventory

  console:
    name: Konsol (lint, test, derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - name: Lint ve biçim
        run: npm run lint
      - name: Testler
        run: npx vitest run
      - name: Derleme
        run: npm run build
      - name: Bağımlılık denetimi
        run: npm audit --audit-level=high --omit=dev
