name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test, güvenlik)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ber
          POSTGRES_PASSWORD: ber
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ber"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      BER_TEST_DATABASE_URL: postgres://ber:ber@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Biçim kontrolü (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt uygulanmamış dosyalar:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Birim ve entegrasyon testleri
        run: go test -race -coverprofile=coverage.out ./...
      - name: Bağımlılık güvenlik taraması (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  go-cross:
    name: Çapraz derleme (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Derle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /dev/null ./agent/cmd/ber-agent
          go build -trimpath -o /dev/null ./server/cmd/ber-server
          go build -trimpath -o /dev/null ./relay/cmd/ber-relay

  agent-native:
    name: Ajan testleri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Ajan ve ortak paket testleri (gerçek envanter toplama dahil)
        env:
          BER_LIVE_INVENTORY: "1"
        run: go test -v -run 'TestLiveCollect' ./agent/internal/inventory/ && go test ./agent/... ./shared/...
      - name: Envanter tanılama komutu
        run: go run ./agent/cmd/ber-agent inventory

  console:
    name: Konsol (lint, test, derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - name: Lint ve biçim
        run: npm run lint
      - name: Testler
        run: npx vitest run
      - name: Derleme
        run: npm run build
      - name: Bağımlılık denetimi
        run: npm audit --audit-level=high --omit=dev

  installers-windows:
    name: Windows MSI (derleme, kurulum, kaldırma)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Konsol
        working-directory: console
        run: npm ci && npm run build
      - name: İkili dosyalar
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-X github.com/BerkayAtag/automation-ber/shared/version.Version=0.0.0-ci" -o dist/ber-agent.exe ./agent/cmd/ber-agent
          go build -trimpath -ldflags "-X github.com/BerkayAtag/automation-ber/shared/version.Version=0.0.0-ci" -o dist/ber-server.exe ./server/cmd/ber-server
      - name: MSI paketleri
        shell: pwsh
        run: ./installers/windows/build.ps1 -Version 0.0.0-ci -AgentExe dist/ber-agent.exe -ServerExe dist/ber-server.exe -ConsoleDir console/dist -OutDir dist
      - name: PostgreSQL (runner imajındaki)
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*'
          Set-Service $svc.Name -StartupType Manual
          Start-Service $svc.Name
      - name: Kurulum, Yayımcı alanı ve temiz kaldırma doğrulaması
        shell: pwsh
        run: ./installers/windows/test-msi.ps1 -AgentMsi (Resolve-Path dist/AutomationBER-Agent-0.0.0-ci-x64.msi) -ServerMsi (Resolve-Path dist/AutomationBER-Server-0.0.0-ci-x64.msi) -DatabaseUrl 'postgres://postgres:root@localhost:5432/postgres?sslmode=disable'
      - name: Kurulum günlükleri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-logs
          path: "*.log"

  installers-macos:
    name: macOS pkg (derleme, kurulum, kaldırma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Universal ikili dosya
        env:
          CGO_ENABLED: "0"
        run: |
          LD="-X github.com/BerkayAtag/automation-ber/shared/version.Version=0.0.0-ci"
          GOARCH=arm64 go build -trimpath -ldflags "$LD" -o dist/ber-agent-arm64 ./agent/cmd/ber-agent
          GOARCH=amd64 go build -trimpath -ldflags "$LD" -o dist/ber-agent-amd64 ./agent/cmd/ber-agent
          lipo -create -output dist/ber-agent dist/ber-agent-arm64 dist/ber-agent-amd64
          lipo -archs dist/ber-agent
      - name: Paket
        run: installers/macos/build-pkg.sh 0.0.0-ci dist/ber-agent dist/AutomationBER-Agent-0.0.0-ci.pkg
      - name: Kurulum ve daemon doğrulaması
        run: |
          sudo installer -pkg dist/AutomationBER-Agent-0.0.0-ci.pkg -target /
          sleep 3
          sudo launchctl print system/io.github.berkayatag.ber.agent | grep -E "state = running"
          /usr/local/bin/ber-agent version
          pkgutil --pkg-info io.github.berkayatag.ber.agent.pkg
      - name: Temiz kaldırma
        run: |
          sudo /usr/local/bin/ber-agent-uninstall
          ! sudo launchctl print system/io.github.berkayatag.ber.agent 2>/dev/null
          test ! -e /usr/local/bin/ber-agent
          test ! -e "/Library/Application Support/BER"
          ! pkgutil --pkg-info io.github.berkayatag.ber.agent.pkg 2>/dev/null

  docker:
    name: Sunucu Docker imajı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: İmaj derlemesi
        run: docker build -f deploy/Dockerfile -t automation-ber-server:ci .
