version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(go)" }
  - package-ecosystem: npm
    directory: /console
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(konsol)" }
    # typescript-eslint TypeScript 7'yi desteklemeyene kadar TypeScript ana sürümü beklenir
    # (peer aralığı ">=4.8.4 <6.1.0"; npm ci çakışmayla durur).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # TanStack Table 9 tam bir API değişikliği (features, atoms); geçiş ayrı bir iş olarak
      # yapılacak. 8.x yamaları gelmeye devam eder.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    groups:
      dev-bagimliliklari:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "deps(ci)" }
